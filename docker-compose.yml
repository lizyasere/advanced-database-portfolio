# MIT 8103 Advanced Database Systems - Portfolio environment
# Case study: Marriott International - Central Reservation & Loyalty (Bonvoy) database
#
# Start:  docker compose up -d
# Stop:   docker compose down          (data is kept in named volumes)
# Reset:  docker compose down -v       (deletes all data)
#
# PostgreSQL is exposed on host port 5433 (5432 is used by another local project).

services:
  postgres:
    image: postgres:16.4
    container_name: marriott_postgres
    environment:
      POSTGRES_USER: mit8103
      POSTGRES_PASSWORD: mit8103_pass
      POSTGRES_DB: marriott_crs
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./portfolio-1-database-design:/scripts/p1
      - ./portfolio-2-query-optimisation:/scripts/p2
      - ./portfolio-3-transactions-concurrency:/scripts/p3

  mongo:
    image: mongo:7.0.14
    container_name: marriott_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./portfolio-4-nosql:/scripts/p4

volumes:
  pg_data:
  mongo_data:
